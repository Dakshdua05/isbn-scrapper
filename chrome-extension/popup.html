<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amazon India ISBN Finder</title>
    <style>
      body { width: 360px; margin: 0; padding: 18px; color: #172033; font: 14px/1.45 system-ui, sans-serif; }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { color: #5a6477; }
      textarea { width: 100%; min-height: 150px; box-sizing: border-box; padding: 10px; border: 1px solid #cbd2df; border-radius: 8px; font: inherit; }
      button { margin-top: 12px; width: 100%; padding: 11px; border: 0; border-radius: 8px; background: #2556d8; color: white; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: .6; cursor: wait; }
      #status { min-height: 20px; margin: 12px 0; color: #5a6477; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      th, td { padding: 7px 3px; border-top: 1px solid #e4e8ef; text-align: left; vertical-align: top; word-break: break-word; }
      th { color: #697386; }
      .found { color: #187043; font-weight: 700; }
      .missing { color: #a24a0b; }
    </style>
  </head>
  <body>
    <h1>ISBN Finder</h1>
    <p>Enter book titles, one per line. Searches run in background tabs in your signed-in browser.</p>
    <textarea id="books" placeholder="Atomic Habits&#10;Let Us C"></textarea>
    <button id="find" type="button">Find ISBNs on Amazon India</button>
    <p id="status" role="status"></p>
    <div id="results"></div>
    <script src="popup.js"></script>
  </body>
</html>
